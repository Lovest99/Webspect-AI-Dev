    <script>
      (function () {
        // Intercept console.error and console.warn for iframe proxy WebSocket closures
        var origError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function (a) { return (a && a.message) || String(a); }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1 || str.indexOf('vite:ws') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function (a) { return (a && a.message) || String(a); }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment
        window.addEventListener('error', function (e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('HMR') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e.reason && (e.reason.message || String(e.reason));
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('HMR') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
